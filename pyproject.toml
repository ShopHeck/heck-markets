[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "heck-markets"
version = "0.1.0"
description = "Prediction-market trading bot for Kalshi and Polymarket"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=43,<46",
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
]

[project.optional-dependencies]
# Authenticated Polymarket CLOB trading (not required for read-only market data)
polymarket = ["py-clob-client>=0.17,<1"]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]

[project.scripts]
heck-markets = "heck_markets.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
